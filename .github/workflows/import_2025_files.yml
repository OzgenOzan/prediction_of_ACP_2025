name: Import 2025 files

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import_2025_files.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-2025-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          path: destination
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source token is available
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          if [ -z "$SOURCE_REPO_PAT" ]; then
            echo "::error::SOURCE_REPO_PAT is missing or unavailable"
            exit 1
          fi

          echo "SOURCE_REPO_PAT is available"

      - name: Checkout 2025 snapshot from source repository
        uses: actions/checkout@v4
        with:
          repository: OzgenOzan/prediction_of_ACP
          ref: 56ab158b9eb4a6d0a697b7b3dd2d25da31617265
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source commit
        working-directory: source
        run: |
          EXPECTED_COMMIT="56ab158b9eb4a6d0a697b7b3dd2d25da31617265"
          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          echo "Expected commit: $EXPECTED_COMMIT"
          echo "Actual commit:   $ACTUAL_COMMIT"

          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"

      - name: Copy full 2025 snapshot into destination
        run: |
          rsync -a \
            --exclude=".git" \
            --exclude="README.md" \
            --exclude=".github/workflows/import_2025_files.yml" \
            source/ destination/

          ls -la destination

      - name: Commit and push
        working-directory: destination
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit \
            -m "Import full 2025 snapshot from OzgenOzan/prediction_of_ACP@56ab158"

          git push origin HEAD:main
